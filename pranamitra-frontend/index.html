<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pranamitra-frontend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" style="position: fixed; inset: 0; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; font-family: 'Poppins', sans-serif;">
        <style>
          @keyframes gentle-pulse {
            0%, 100% { transform: scale(0.96); }
            50% { transform: scale(1.04); }
          }
          @keyframes loader-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
          @keyframes text-fade {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
          }
          .pulse { animation: gentle-pulse 1.2s ease-in-out infinite; }
          .spin { animation: loader-spin 2s linear infinite; }
          .fade { animation: text-fade 1.2s ease-in-out infinite; }
        </style>
        <div style="position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 32px;">
          <div class="spin" style="position: absolute; width: 160px; height: 160px; border-radius: 50%; border: 1px solid #f1f5f9; border-top: 1px solid #B71C1C;"></div>
          <div class="pulse" style="width: 128px; height: 128px; border-radius: 24px; background: white; padding: 4px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1),0 4px 6px -4px rgba(0,0,0,0.1); overflow: hidden; display: flex; align-items: center; justify-content: center;">
            <img src="/src/assets/logos/pranamitra-logo.jpeg" alt="Logo" style="width: 100%; height: 100%; object-fit: cover; border-radius: 16px;" />
          </div>
        </div>
        <div style="text-align: center;">
          <h1 style="font-size: 30px; font-weight: 800; margin: 0; color: #212121; letter-spacing: -0.025em;">PranaMitra</h1>
          <p style="font-size: 12px; font-weight: 600; margin: 8px 0 0 0; color: #6B7280; text-transform: uppercase; letter-spacing: 0.1em;">Blood Management System</p>
          <p class="fade" style="font-size: 14px; font-weight: 700; color: #B71C1C; margin: 24px 0 0 0; letter-spacing: 0.1em;">Loading...</p>
          <div style="margin-top: 32px; border-top: 1px solid #f1f5f9; padding-top: 32px;">
            <p style="font-size: 12px; font-weight: 700; color: #212121; margin: 0;">Every Drop Counts.</p>
            <p style="font-size: 10px; font-weight: 600; color: #6B7280; text-transform: uppercase; letter-spacing: 0.05em; margin: 6px 0 0 0;">Every Donation Saves a Life.</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
